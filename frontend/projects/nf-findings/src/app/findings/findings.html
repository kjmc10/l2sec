<section class="page">

  <header class="header">
    <h2>Findings</h2>
  </header>

  <!-- 🔥 BULK ACTIONS -->
  <div class="bulk-actions" *ngIf="selectedIds.size > 0">
    <span>{{ selectedIds.size }} selected</span>

    <button (click)="bulkUpdate('false_positive')">
      False Positive
    </button>

    <button (click)="bulkUpdate('accepted_risk')">
      Accept Risk
    </button>

    <button (click)="bulkUpdate('fixed')">
      Fixed
    </button>
  </div>

  <!-- filtros -->
  <div class="filters">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="search"
      (input)="applyFilters()"
    />

    <select [(ngModel)]="severityFilter" (change)="applyFilters()">
      <option value="">All Severity</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
      <option value="info">Info</option>
    </select>

    <select [(ngModel)]="statusFilter" (change)="applyFilters()">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="false_positive">False Positive</option>
      <option value="accepted_risk">Accepted Risk</option>
      <option value="fixed">Fixed</option>
    </select>
  </div>

  <!-- tabla -->
  <div *ngIf="loading">Loading...</div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th></th> <!-- checkbox -->
        <th>Name</th>
        <th>Severity</th>
        <th>Status</th>
        <th>URL</th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let f of filtered"
        (click)="openDetail(f)"
        [class.selected]="selected?.id === f.id"
      >
        <td>
          <input
            type="checkbox"
            (click)="$event.stopPropagation()"
            (change)="toggleSelect(f.id)"
            [checked]="isSelected(f.id)"
          />
        </td>

        <td>{{ f.name }}</td>

        <td>
          <shared-severity-badge [severity]="f.severity"></shared-severity-badge>
        </td>

        <td>
          <shared-status-badge [status]="f.status"></shared-status-badge>
        </td>

        <td>{{ f.url }}</td>
      </tr>
    </tbody>
  </table>

  <!-- DRAWER -->
  <div class="drawer" *ngIf="selected">
    <div class="drawer-content">

      <button class="close" (click)="closeDetail()">✕</button>

      <h3>{{ selected.name }}</h3>

      <shared-severity-badge [severity]="selected.severity"></shared-severity-badge>
      <shared-status-badge [status]="selected.status"></shared-status-badge>

      <p><strong>URL:</strong> {{ selected.url }}</p>
      <p><strong>Method:</strong> {{ selected.method }}</p>
      <p><strong>CWE:</strong> {{ selected.cwe }}</p>

      <div class="evidence">
        <h4>Evidence</h4>
        <pre>{{ selected.evidence }}</pre>
      </div>

      <div class="remediation">
        <h4>Remediation</h4>
        <p>{{ selected.remediation }}</p>
      </div>

      <div class="actions">
        <button (click)="updateStatus('false_positive')" [disabled]="updating">
          False Positive
        </button>

        <button (click)="updateStatus('accepted_risk')" [disabled]="updating">
          Accept Risk
        </button>

        <button (click)="updateStatus('fixed')" [disabled]="updating">
          Mark Fixed
        </button>
      </div>
    </div>
  </div>

</section>
